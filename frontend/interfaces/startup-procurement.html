<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css"><title>Procurement | GovBridge</title>
  <script src="assets/config.js"></script>
</head>
<body data-interface="startup" data-route="/startup/procurement">
<div id="toastHost"></div>
<div id="view-app" class="view">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a href="#/" class="brand" onclick="Router.go('/')">
        <svg class="mark" viewBox="0 0 34 34" fill="none"><rect width="34" height="34" rx="9" fill="#fff"/><path d="M9 22V13.5L17 9l8 4.5V22" stroke="#0B2545" stroke-width="1.8" stroke-linejoin="round"/><path d="M13.5 22v-6h7v6" stroke="#D97B1D" stroke-width="1.8"/></svg>
        <div>GovBridge<small style="color:rgba(255,255,255,.55)">Innovation Platform</small></div>
      </a>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-foot">
        <a href="#" onclick="handleLogout()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg> Log out</a>
      </div>
    </aside>

    <div>
      <div class="topbar">
        <div class="flex items-center gap-12">
          <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <div class="crumbs" id="crumbs">Dashboard</div>
        </div>
        <div class="topbar-right">
          <button class="icon-btn" onclick="toggleNotifPanel()" aria-label="Notifications" id="notifBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
            <span class="dot" id="notifDot" style="display:none;"></span>
          </button>
          <button class="avatar-chip" onclick="Router.go(getSession().role==='government'?'/gov/settings':'/startup/profile')">
            <span class="avatar" id="topAvatar">G</span>
            <span class="name" id="topName">Government</span>
          </button>
        </div>
      </div>
      <div id="appPage" class="page"></div>
    </div>
  </div>
</div>
<!-- Notifications dropdown panel -->
<div id="notifPanel" class="card" style="display:none;position:fixed;top:66px;right:24px;width:340px;max-height:420px;overflow-y:auto;z-index:900;box-shadow:var(--shadow-3);">
  <div class="panel-head"><h3>Notifications</h3><button class="link-btn small" onclick="clearAllNotifs()">Mark all read</button></div>
  <div id="notifList"></div>
</div>

<!-- Generic modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>
<script src="assets/app.js"></script>
<script src="assets/chatbot.js"></script>
</body>
</html>
